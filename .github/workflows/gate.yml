name: gate
# The `three-repo` job is the test that the three artifacts are one system:
# the canonical flow validates under polydiagram's rules, agent-dec's
# flow-bound run verifies against flowtrace's flows as the registry, and the
# gate reproduces the expected reports with execution evidence enabled.
#
# PINS. polydiagram is consumed at azimuth-ink/polydiagram@ce3598f (the
# revision of 2026-10-11 within flow.spec/v0.2 — R12–R15, DG13 — software
# 0.3.0) and agent-dec at azimuth-ink/agent-dec@05874ca (the revision of
# 2026-10-11 within DEC v0.2 — authorization / completion evidence,
# human_approval, steps 1c/1d, dec-trust/0.2 classes — software 0.2.0).
# Those refs exist only on unpushed branches today: until they are pushed,
# this job cannot check them out or pip-install them from GitHub, and the
# same steps must be run locally from sibling checkouts —
# `make dev && make check` (SIBLINGS=.. by default) does exactly that, with
# the same commands as below. Once pushed, replace nothing: the refs below are
# the pins.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: the same job against the companions' latest main (drift surfaces here)

env:
  POLYDIAGRAM_REF: ce3598f
  AGENT_DEC_REF: 05874ca

jobs:
  three-repo:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: azimuth-ink/polydiagram, ref: "${{ env.POLYDIAGRAM_REF }}", path: siblings/polydiagram }
      - uses: actions/checkout@v5
        with: { repository: azimuth-ink/agent-dec, ref: "${{ env.AGENT_DEC_REF }}", path: siblings/agent-dec }
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python-version }}" }

      - name: Install flowtrace, dev dependencies and the pinned companions
        # The companions are installed as wheels from the pinned git refs (identical to the
        # checkouts above). Locally: `make dev`, which installs the same two packages from the
        # sibling checkouts — never with `pip install -e`, which would resolve agent-dec's default
        # methods directory against the checkout and mask the installed-package behaviour.
        run: |
          pip install -r requirements-dev.txt
          pip install "polydiagram @ git+https://github.com/azimuth-ink/polydiagram@${POLYDIAGRAM_REF}" \
                      "agent-dec @ git+https://github.com/azimuth-ink/agent-dec@${AGENT_DEC_REF}"
          pip install -e .

      - name: Unit, property and gate tests (pytest + hypothesis)
        env: { FLOWTRACE_SIBLINGS: "${{ github.workspace }}/siblings" }
        run: python3 -m pytest -q

      - name: Canonical descriptor (2.1.0) and the signed example set are byte-identical across the three repositories
        run: |
          echo "bcbf43158c31ab7b5ca5dde55de1fe48c81891eacc05def4f1d188a49beb148b  examples/flows/quote-issue.flow.yaml" | sha256sum -c -
          cmp examples/flows/quote-issue.flow.yaml tests/fixtures/quote-issue.canon.yaml
          cmp examples/flows/quote-issue.flow.yaml siblings/polydiagram/examples/retail-quote.flow.yaml
          cmp examples/flows/quote-issue.flow.yaml siblings/agent-dec/examples/flow-bound/flows/quote-issue.flow.yaml
          # every vendored artifact under examples/dec/ (trust bundle, issuer key, methods, the flow-bound run with its
          # evidence members, the variants, the cancelled pair, the negatives, the hosted run) equals the checkout's
          n=0; for f in $(cd examples/dec && find . -type f ! -name SOURCE | sort); do
            cmp "examples/dec/$f" "siblings/agent-dec/examples/$f"; n=$((n + 1)); done; echo "identical: $n vendored artifact(s)"
          echo "fad9362bcab1866e2e08bfb0f98c5a199b01b231ad13b855dcee86444e43d6b6  examples/dec/methods/limits-check-3.1.0.json" | sha256sum -c -

      - name: Flows validate with polydiagram's validator (R1–R15, strict, against its registry)
        run: polydiagram-flows --dir examples/flows --registry siblings/polydiagram/examples/registry-stub.yaml --strict

      - name: agent-dec's flow-bound example verifies with flowtrace's flows as the registry (step 1b FB4, 1c, 1d + conformance)
        run: |
          # --methods: the installed verifier's default methods directory is relative to its package, not the checkout.
          # --trust-bundle: the dec-trust/0.2 bundle carries the policy_authorities[] and approvers[] classes the s6
          # evidence verifies in (a bare PEM resolves keys[] only and fails the authorization member).
          dec-verify --dir siblings/agent-dec/examples/flow-bound --methods siblings/agent-dec/examples/methods \
                     --trust-bundle siblings/agent-dec/examples/trust-bundle.json --flow-registry examples/flows --require-convergent
          dec-verify --dir examples/dec/flow-bound --methods examples/dec/methods \
                     --trust-bundle examples/dec/trust-bundle.json --flow-registry examples/flows --require-convergent
          # the vendored variants and the cancelled pair read as agent-dec's own CI reads them
          for v in s5-degraded s6-reconciled s6-approval; do
            dec-verify --dir examples/dec/flow-bound/variants/$v --methods examples/dec/methods \
                       --trust-bundle examples/dec/trust-bundle.json --flow-registry examples/flows --require-convergent; done
          dec-verify --dir examples/dec/flow-bound/cancelled/parent --methods examples/dec/methods \
                     --trust-bundle examples/dec/trust-bundle.json --flow-registry examples/flows \
                     --runs-dir examples/dec/flow-bound/cancelled --require-convergent

      - name: Gate — the seven windows with execution evidence, certificates from the agent-dec checkout
        run: |
          mkdir -p build/reports
          ARGS="--flows examples/flows --config flowtrace.yaml --alerts examples/alerts.yaml \
                --queries examples/queries/quote-issue.queries.yaml \
                --trust-bundle siblings/agent-dec/examples/trust-bundle.json --dec-dir siblings/agent-dec/examples/flow-bound \
                --execution-evidence --reproducible"
          TEL=examples/telemetry
          flowtrace gate $ARGS --telemetry $TEL/quote-issue.full.otlp.jsonl --out build/reports/quote-issue.full.json
          for w in s5-degraded s6-unknown-reconciled; do
            flowtrace gate $ARGS --telemetry $TEL/quote-issue.$w.otlp.jsonl \
                      --baseline build/reports/quote-issue.full.json --out build/reports/quote-issue.$w.json; done
          for w in s5-silent s4-missing-attr s6-retry-unreconciled; do
            if flowtrace gate $ARGS --telemetry $TEL/quote-issue.$w.otlp.jsonl \
                 --baseline build/reports/quote-issue.full.json --out build/reports/quote-issue.$w.json; then
              echo "expected the $w window to fail the gate" >&2; exit 1; fi; done
          if flowtrace gate $ARGS --runs-dir siblings/agent-dec/examples/flow-bound/negative/cancellation-not-propagated \
               --telemetry $TEL/quote-issue.cancelled-child-late.otlp.jsonl \
               --baseline build/reports/quote-issue.full.json --out build/reports/quote-issue.cancelled-child-late.json; then
            echo "expected the cancelled-child-late window to fail the gate" >&2; exit 1; fi

      - name: Expected reports reproduced byte for byte
        run: |
          for w in full s5-degraded s6-unknown-reconciled s5-silent s4-missing-attr s6-retry-unreconciled cancelled-child-late; do
            cmp build/reports/quote-issue.$w.json examples/expected/quote-issue.$w.json && echo "identical: quote-issue.$w.json"
          done
          flowtrace validate-report examples/expected/quote-issue.full.json
          flowtrace validate-report examples/expected/quote-issue.cancelled-child-late.json

      - name: Synthetic telemetry regenerates identically (seeded)
        run: |
          python3 tools/make_synthetic_telemetry.py --out-dir build/telemetry
          for w in full s5-degraded s6-unknown-reconciled s5-silent s4-missing-attr s6-retry-unreconciled cancelled-child-late; do
            cmp build/telemetry/quote-issue.$w.otlp.jsonl examples/telemetry/quote-issue.$w.otlp.jsonl; done

  # Weekly: the same steps against the companions' latest `main`, so that a
  # change in either specification surfaces here before a release pins it.
  # (polydiagram and agent-dec carry the mirror of this job against flowtrace's
  # latest tag.) A failure here is a drift report, not a broken pin.
  three-repo-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: azimuth-ink/polydiagram, ref: main, path: siblings/polydiagram }
      - uses: actions/checkout@v5
        with: { repository: azimuth-ink/agent-dec, ref: main, path: siblings/agent-dec }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install from the sibling checkouts (latest) and run everything the pinned job runs
        env: { FLOWTRACE_SIBLINGS: "${{ github.workspace }}/siblings", PIP_FLAGS: "" }
        run: |
          make dev SIBLINGS="$GITHUB_WORKSPACE/siblings" PIP_FLAGS=""
          make check SIBLINGS="$GITHUB_WORKSPACE/siblings"
